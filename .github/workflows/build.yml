name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libssl-dev libffi-dev libltdl-dev ant

    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Initialize Buildozer Config
      run: |
        buildozer init
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,hostpython3/' buildozer.spec
        sed -i 's/#p4a.branch =/p4a.branch = master/' buildozer.spec
        sed -i 's/source.main =/source.main = main.py/' buildozer.spec
        sed -i 's/#android.permissions =/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/#android.orientation = portrait/android.orientation = portrait/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: bin/*.apk
