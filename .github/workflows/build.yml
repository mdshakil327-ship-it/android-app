name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libssl-dev libffi-dev libltdl-dev ant
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Direct License Bypass & Build APK
        run: |
          # 1. Buildozer file banayega
          yes | buildozer init || true
          
          # 2. DIRECT BYPASS: Google licenses ko forcefully accept karega
          echo "android.accept_sdk_license = True" >> buildozer.spec
          
          # 3. APK build karega
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
